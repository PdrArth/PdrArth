name: GitHub Profile Metrics

on:
  push:
    branches: [main]

  schedule:
    - cron: "0 12 * * *"

  workflow_dispatch:

jobs:
  github-metrics:

    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:

      # ============================================================
      # PERFIL + LINGUAGENS
      # ============================================================

      - name: Main Metrics
        uses: lowlighter/metrics@latest

        with:
          token: ${{ secrets.METRICS_TOKEN }}

          filename: github-metrics.svg
          user: PdrArth
          template: classic

          commits_authoring: >-
            PdrArth,
            Pedro Arthur,
            Pedro Arthur O. Januário,
            129990196+PdrArth@users.noreply.github.com,
            pedroarthurpdrarth@gmail.com

          base: header, activity, community, repositories, metadata

          config_timezone: America/Sao_Paulo


          # LANGUAGES
          plugin_languages: yes

          plugin_languages_indepth: yes

          plugin_languages_indepth_custom: >-
            Donega-Negocios-Digitais/obsidian-note-reviewer,
            winfrabria/saas-winfrabr-monitor-licitacao,
            PdrArth/ProjetoCopillot,
            PdrArth/projeto-estoque

          plugin_languages_categories: programming

          plugin_languages_recent_categories: programming

          plugin_languages_colors: github

          plugin_languages_ignored: >-
            Shell,
            CMake,
            PLpgSQL,
            XML,
            JSON,
            Markdown,
            INI

          plugin_languages_limit: 8

          # Mostra histórico + linguagens recentes
          plugin_languages_sections: most-used, recently-used

          # Analisa atividade recente
          plugin_languages_recent_days: 30
          plugin_languages_recent_load: 300

          plugin_languages_threshold: 0%

          plugin_languages_analysis_timeout: 60
          plugin_languages_analysis_timeout_repositories: 15


      # ============================================================
      # ISOMETRIC COMMIT CALENDAR
      # ============================================================

      - name: Isometric Commit Calendar
        uses: lowlighter/metrics@latest

        with:
          token: ${{ secrets.METRICS_TOKEN }}

          filename: github-isocalendar.svg
          user: PdrArth

          base: ""

          plugin_isocalendar: yes
          plugin_isocalendar_duration: full-year

          config_timezone: America/Sao_Paulo


      # ============================================================
      # CODING HABITS / RECENT ACTIVITY CHARTS
      # ============================================================

      - name: Coding Habits
        uses: lowlighter/metrics@latest

        with:
          token: ${{ secrets.METRICS_TOKEN }}

          filename: github-habits.svg
          user: PdrArth

          base: ""

          plugin_habits: yes

          # Não quero aqueles fatos aleatórios
          plugin_habits_facts: no

          # Gráficos de atividade
          plugin_habits_charts: yes
          plugin_habits_charts_type: graph

          # Base de dados analisada
          plugin_habits_from: 300
          plugin_habits_days: 30

          # Linguagens recentes
          plugin_habits_languages_limit: 8
          plugin_habits_languages_threshold: 0%

          # Remove horários sem atividade
          plugin_habits_trim: yes

          config_timezone: America/Sao_Paulo


      # ============================================================
      # TECHNOLOGY TOPICS - WITH ICONS
      # ============================================================

      - name: Technology Topics
        uses: lowlighter/metrics@latest

        with:
          token: NOT_NEEDED

          filename: github-topics.svg
          user: PdrArth

          base: ""

          plugin_topics: yes

          # É exatamente o "With icons"
          plugin_topics_mode: icons

          # Prioriza topics com atividade recente
          plugin_topics_sort: activity

          plugin_topics_limit: 16


      # ============================================================
      # FEATURED REPOSITORIES
      # ============================================================

      - name: Featured Repositories
        uses: lowlighter/metrics@latest

        with:
          token: ${{ secrets.METRICS_TOKEN }}

          filename: github-repositories.svg
          user: PdrArth

          base: ""

          plugin_repositories: yes

          # Pega os seus repositórios fixados no perfil
          plugin_repositories_pinned: 4

          plugin_repositories_forks: no
