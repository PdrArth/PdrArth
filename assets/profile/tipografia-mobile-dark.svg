<svg xmlns="http://www.w3.org/2000/svg" width="185" height="280" viewBox="0 0 185 280" fill="none" role="img" aria-labelledby="title">
<title id="title">Pedro Arthur, assinatura tipográfica.</title>
<style>.signature{animation:signature 5.6s ease-in-out infinite}.signature-second{animation-delay:-1s}.cursor{animation:cursor 5.6s ease-in-out infinite}@keyframes signature{0%,100%{transform:translateY(1.5px);opacity:.88}50%{transform:translateY(-1.5px);opacity:1}}@keyframes cursor{0%,100%{transform:translateY(0)}50%{transform:translateY(-130px)}}@media(prefers-reduced-motion:reduce){.signature{animation:none}.cursor{animation:cursor-small 8s ease-in-out infinite}}@keyframes cursor-small{0%,100%{transform:translateY(0);opacity:.65}50%{transform:translateY(-8px);opacity:1}}</style>
<g class="signature"><text x="3" y="62" fill="#f2dfbf" font-family="Georgia, Times New Roman, serif" font-size="44" font-weight="400" text-anchor="start" font-style="italic">Pedro</text></g><g class="signature signature-second"><text x="3" y="113" fill="#f2dfbf" font-family="Georgia, Times New Roman, serif" font-size="44" font-weight="400" text-anchor="start" font-style="italic">Arthur</text></g><path d="M166 10V245" stroke="#8e8a80" stroke-width="1"/><path class="cursor" d="M163 242h6v6h-6z" fill="#f2dfbf"/>
</svg>
